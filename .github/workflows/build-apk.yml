name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Scaffold native project
        run: flutter create --org com.sahmipicks --project-name sahmi_picks_mobile app_build

      - name: Allow internet + foreground service
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path("app_build/android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          for perm in ['<uses-permission android:name="android.permission.INTERNET"/>',
                       '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
                       '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>',
                       '<uses-permission android:name="android.permission.WAKE_LOCK"/>']:
              if perm not in t:
                  t = t.replace("<application", perm + "\n    <application", 1)
          svc = ('<service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" '
                 'android:exported="false" android:foregroundServiceType="dataSync" />')
          if 'flutter_foreground_task' not in t:
              t = t.replace("</application>", "        " + svc + "\n    </application>", 1)
          p.write_text(t)
          print("patched:", 'FOREGROUND_SERVICE' in p.read_text() and 'ForegroundService' in p.read_text())
          EOF

      - name: Copy app source + data
        run: |
          cp pubspec.yaml analysis_options.yaml app_build/
          rm -rf app_build/lib app_build/test
          cp -r lib app_build/
          cp -r assets app_build/

      - name: Icons (best effort)
        run: cd app_build && dart run flutter_launcher_icons || true

      - name: Pub get
        run: cd app_build && flutter pub get

      - name: Analyze
        run: cd app_build && flutter analyze || true

      - name: Build APK
        run: cd app_build && flutter build apk --release

      - name: Verify bundled data inside APK
        run: |
          python3 - <<'EOF'
          import zipfile, sys
          z = zipfile.ZipFile("app_build/build/app/outputs/flutter-apk/app-release.apk")
          names = z.namelist()
          data = [n for n in names if n.startswith("assets/flutter_assets/assets/data/")]
          models = [n for n in names if n.startswith("assets/flutter_assets/assets/models/")]
          parity = [n for n in names if n.endswith("parity_test.json")]
          print("data files:", len(data), "| model files:", len(models), "| parity:", len(parity))
          assert len(data) >= 60, f"missing bundled data! found {len(data)}"
          assert len(models) >= 90, f"missing models! found {len(models)}"
          assert parity, "missing parity_test.json!"
          print("APK bundle check PASSED")
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahmi-picks-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app_build/build/app/outputs/flutter-apk/app-release.apk
